<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSG Hostel Beaconn</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app-container">
        <div id="login-view" class="hidden">
            <h1 id="beaconn">Beaconn</h1>
            <h4>Login using <a href="https://edviewx.psgtech.ac.in/Hostel/Home/Index">edviewx</a> credentials</h4>
            <form id="login-form">
                <label for="login-username">Rollno</label>
                <input type="text" id="login-username">
                <label for="login-password">Password</label>
                <input type="password" id="login-password">
                <div id="forgot">
                    <a href="https://edviewx.psgtech.ac.in/Hostel/ForgotPassword/ForgotPassword">Forgot Password?</a>
                </div>
                <input type="submit" id="login-submit" value="Submit">
            </form>
            <p id="disclaimer">Your credentials are only stored in your browser storage</p>
        </div>
    </div>
</body>
</html>
